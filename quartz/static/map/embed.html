<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tamarind Valley Collective — farm map</title>
  <script src="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@4/dist/maplibre-gl.css" rel="stylesheet">
  <style>html, body { margin: 0; height: 100% } #map { position: absolute; inset: 0 }</style>
</head>
<body>
  <div id="map"></div>
  <script>
    // Theme: honour ?theme=dark|light, else follow the OS preference.
    const q = new URLSearchParams(location.search);
    const dark = q.has("theme") ? q.get("theme") === "dark"
                                : matchMedia("(prefers-color-scheme: dark)").matches;
    const map = new maplibregl.Map({
      container: "map",
      style: `tvc-base-${dark ? "dark" : "light"}.json`,   // relative to /static/map/
      center: [77.6470, 12.3503],   // the farm
      zoom: 14.3,
    });
    map.addControl(new maplibregl.NavigationControl({ showCompass: false }));
    map.addControl(new maplibregl.ScaleControl());
  </script>
</body>
</html>
